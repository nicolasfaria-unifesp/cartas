<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Cartas 1x1 P2P</title>
  <!-- Vue 3 e PeerJS via CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #app { width: 100%; max-width: 500px; padding: 20px; }
    
    .card-panel { background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { font-size: 1.2rem; margin-bottom: 15px; text-align: center; color: #f39c12; }
    
    .setup-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    input { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; width: 100%; text-align: center; }
    button { padding: 10px 15px; border-radius: 6px; border: none; background: #27ae60; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2ecc71; }
    button:disabled { background: #555; cursor: not-allowed; }

    .status-text { font-size: 0.9rem; text-align: center; color: #aaa; margin-top: 5px; }

    .board { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
    .player-zone { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; }
    .opponent { border: 2px solid #e74c3c; }
    .player { border: 2px solid #2ecc71; }
    
    .hp-bar { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
    
    .hand { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
    .card { background: #34495e; border: 2px solid #f1c40f; padding: 10px; border-radius: 8px; cursor: pointer; width: 90px; text-align: center; user-select: none; }
    .card:hover { transform: translateY(-3px); }
    .card strong { display: block; font-size: 0.85rem; margin-bottom: 5px; }
    .card span { font-size: 0.75rem; color: #e74c3c; display: block; }

    .actions { display: flex; justify-content: space-between; gap: 10px; }
    .btn-turn { background: #e67e22; flex: 1; }
    .btn-turn:hover { background: #f39c12; }
  </style>
</head>
<body>

<div id="app">
  <div class="card-panel">
    <h2>Card Battle 1x1</h2>

    <!-- TELA DE CONEXÃO -->
    <div v-if="!connected" class="setup-box">
      <p class="status-text">Seu ID de Conexão:</p>
      <input type="text" :value="myId" readonly @click="$event.target.select()" />
      
      <p class="status-text" style="margin-top: 10px;">Conectar a um Oponente:</p>
      <input type="text" v-model="targetId" placeholder="Cole o ID do Oponente" />
      <button @click="connectToPeer" :disabled="!targetId">Conectar</button>
      
      <p class="status-text">{{ status }}</p>
    </div>

    <!-- TABULEIRO DE JOGO -->
    <div v-else class="board">
      <p class="status-text">
        Turno: <strong :style="{ color: isMyTurn ? '#2ecc71' : '#e74c3c' }">{{ isMyTurn ? 'SEU TURNO' : 'TURNO DO OPONENTE' }}</strong>
      </p>

      <!-- OPONENTE -->
      <div class="player-zone opponent">
        <h3>Oponente</h3>
        <div class="hp-bar">❤️ HP: {{ opponent.hp }}</div>
      </div>

      <!-- JOGADOR -->
      <div class="player-zone player">
        <h3>Você</h3>
        <div class="hp-bar">❤️ HP: {{ player.hp }} | 💧 Mana: {{ player.mana }}</div>

        <div class="hand">
          <div 
            v-for="(card, index) in player.hand" 
            :key="card.id" 
            class="card"
            @click="playCard(card, index)"
          >
            <strong>{{ card.name }}</strong>
            <span>💥 -{{ card.damage }} HP</span>
            <small>💧 {{ card.cost }}</small>
          </div>
        </div>

        <div class="actions">
          <button @click="drawCard" :disabled="!isMyTurn || player.hand.length >= 4">Comprar Carta</button>
          <button class="btn-turn" @click="endTurn" :disabled="!isMyTurn">Passar Turno</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const { createApp, ref, reactive } = Vue;

  createApp({
    setup() {
      const myId = ref('Gerando...');
      const targetId = ref('');
      const status = ref('Aguardando servidor de rede...');
      const connected = ref(false);
      const isMyTurn = ref(false);

      let peer = null;
      let conn = null;

      const player = reactive({ hp: 30, mana: 3, hand: [] });
      const opponent = reactive({ hp: 30 });

      // Inicializa PeerJS
      peer = new Peer();

      peer.on('open', (id) => {
        myId.value = id;
        status.value = 'Pronto! Envie seu ID para o seu amigo.';
      });

      // Aguarda conexão recebida (Host)
      peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
        isMyTurn.value = true; // Host começa
        connected.value = true;
      });

      // Conecta ao parceiro (Cliente)
      function connectToPeer() {
        if (!targetId.value) return;
        status.value = 'Conectando...';
        conn = peer.connect(targetId.value);
        setupConnection();
        isMyTurn.value = false; // Cliente aguarda
        connected.value = true;
      }

      // Escuta as mensagens em tempo real
      function setupConnection() {
        conn.on('data', (data) => {
          if (data.type === 'ATTACK') {
            player.hp -= data.damage;
          } else if (data.type === 'END_TURN') {
            isMyTurn.value = true;
            player.mana = Math.min(player.mana + 2, 10); // Recupera mana no turno
          }
        });
      }

      function drawCard() {
        if (!isMyTurn.value || player.hand.length >= 4) return;
        player.hand.push({
          id: Date.now(),
          name: 'Ataque',
          cost: 1,
          damage: Math.floor(Math.random() * 4) + 3
        });
      }

      function playCard(card, index) {
        if (!isMyTurn.value || player.mana < card.cost) return;

        player.mana -= card.cost;
        opponent.hp -= card.damage;
        player.hand.splice(index, 1);

        conn.send({ type: 'ATTACK', damage: card.damage });
      }

      function endTurn() {
        if (!isMyTurn.value) return;
        isMyTurn.value = false;
        conn.send({ type: 'END_TURN' });
      }

      return {
        myId,
        targetId,
        status,
        connected,
        isMyTurn,
        player,
        opponent,
        connectToPeer,
        drawCard,
        playCard,
        endTurn
      };
    }
  }).mount('#app');
</script>
</body>
</html>
